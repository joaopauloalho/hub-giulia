name: Hub Giulia 4.2 Bootstrap

on:
  push:
    branches:
      - agent/patient-acquisition-referrals-v1

permissions:
  contents: write

concurrency:
  group: hub-giulia-v42-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v42-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/patient-acquisition-referrals-v1

      - name: Apply Hub Giulia 4.2 patch
        run: python scripts/apply-v42.py

      - name: Commit materialized implementation
        shell: bash
        run: |
          git rm scripts/apply-v42.py .github/workflows/v42-bootstrap.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Hub Giulia 4.2 — Origem de Pacientes & Indicações [v42-applied]"
          git push origin HEAD:agent/patient-acquisition-referrals-v1
