name: Traceability codemod

on:
  push:
    branches:
      - agent/product-traceability-v1
    paths:
      - scripts/traceability-codemod.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/product-traceability-v1
          fetch-depth: 0
      - name: Apply surgical source edits
        run: python3 scripts/traceability-codemod.py
      - name: Commit edits
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/registrar/RegistrarPage.tsx src/pages/registrar/InjetaveisScreen.tsx
          git commit -m "feat(registrar): wire product traceability into attendance"
          git push origin HEAD:agent/product-traceability-v1
