  <circle cx="198" cy="145" r="2.5" fill="white"/>
  <path d="M 171 143 Q 194 136 217 143" stroke="#C4956A" stroke-width="0.8"/>
  <path d="M 171 154 Q 194 159 217 154" stroke="#D4A574" stroke-width="0.6"/>

